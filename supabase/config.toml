# Minimal Supabase CLI config. Migrations live in backend/migrations (see docs/SETUP.md).
project_id = "job-application-tracker"

[functions.parse-job]
verify_jwt = true

[functions.match-resume]
verify_jwt = true

# Google redirects to email-connect without a Supabase session, and a
# scheduled email-scan authenticates with EMAIL_SCAN_SECRET; both check the
# caller themselves (docs/EMAIL_SYNC.md).
[functions.email-connect]
verify_jwt = false

[functions.email-scan]
verify_jwt = false
