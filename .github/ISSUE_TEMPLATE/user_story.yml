name: User story
description: A new feature, written from the user's point of view
labels: [enhancement]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      value: As a job seeker, I want … so that …
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Given … when … then …
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (API, data model, UI)
